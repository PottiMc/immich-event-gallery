# Monthly update pull requests for npm dependencies, the Docker base image and
# GitHub Actions. Security updates arrive immediately regardless, once
# "Dependabot security updates" is enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    # Major versions (Express 5, ESLint 10, TypeScript 7, ...) need code
    # changes and are upgraded by hand; only minor/patch updates arrive here.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

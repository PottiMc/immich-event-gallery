#
# Immich Event Gallery – photo portal stack
#
# A complete, self-contained Immich (server, machine learning, database,
# Valkey) plus the branded portal (a fork of Immich Public Proxy). It is fully
# separate from any other Immich you may run: own container names (eg_*), own
# networks, own data folders, different ports.
#
# Configuration: copy .env.example to .env and fill it in. With Portainer,
# paste the variables under "Environment variables" -> "Advanced mode".
# Full guide: docs/deployment.md
#
# Based on the official Immich docker-compose.yml (v3.2.2).
#
# Hardening:
# - Two networks: the portal only reaches the Immich server, not the
#   database, Valkey or machine learning (eg-portal / eg-internal).
# - The portal runs with a read-only filesystem (except its small settings
#   volume), no Linux capabilities and memory/process limits.
# - CPU caps on the portal, the Immich server and machine learning, so a flood
#   of requests or a big import cannot starve the rest of the host
#   (PORTAL_CPUS, IMMICH_CPUS, ML_CPUS; never more than the host has).
# - Logs are capped at 3 x 10 MB per container.
#

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  immich-server:
    container_name: eg_immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # Immich web UI for the operator (upload / manage). Not for guests.
      # 2284 instead of 2283 so it does not clash with another Immich.
      - "${BIND_IP:-0.0.0.0}:${IMMICH_HOST_PORT:-2284}:2283"
    networks:
      - eg-internal
      - eg-portal
    depends_on:
      - redis
      - database
    restart: always
    cpus: ${IMMICH_CPUS:-2}
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      disable: false

  # Face recognition, smart search and duplicate detection. Needs about
  # 1-2 GB RAM; the models (~1 GB) are downloaded on first use and kept in the
  # eg-model-cache volume. Immich finds it at the default URL
  # http://immich-machine-learning:3003. Remove this service (and disable
  # machine learning in Immich) if the server is short on memory.
  immich-machine-learning:
    container_name: eg_immich_machine_learning
    # Hardware acceleration: append -openvino (Intel), -cuda (NVIDIA) etc. to
    # the tag, see https://docs.immich.app/features/ml-hardware-acceleration
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    volumes:
      - eg-model-cache:/cache
    environment:
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - eg-internal
    restart: always
    cpus: ${ML_CPUS:-2}
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      disable: false

  redis:
    container_name: eg_immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks:
      - eg-internal
    restart: always
    security_opt:
      - no-new-privileges:true
    logging: *logging

  database:
    container_name: eg_immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if the database lives on an HDD instead of an SSD:
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - eg-internal
    restart: always
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      disable: false

  portal:
    container_name: eg_portal
    image: ${PORTAL_IMAGE:-ghcr.io/pottimc/immich-event-gallery:latest}
    environment:
      # Immich in the same stack - the host name is the service name above
      IMMICH_URL: http://immich-server:2283
      # Public address of the guest portal, used for QR codes and link previews
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Immich API key with ONLY the "sharedLink.read" permission
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      # Random value, at least 32 characters. Never change it, or all printed
      # QR codes stop working and every guest is logged out.
      PORTAL_SECRET: ${PORTAL_SECRET}
      # Password for the admin pages (port 3001 inside the container)
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD}
      # Which proxies may set X-Forwarded-For; empty = private networks
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Optional removal requests by e-mail (docs/configuration.md)
      REMOVAL_REQUEST_TO: ${REMOVAL_REQUEST_TO:-}
      REMOVAL_REQUEST_LANG: ${REMOVAL_REQUEST_LANG:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      IMMICH_ADMIN_URL: ${IMMICH_ADMIN_URL:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Optional branding: logos, icons and branding.json (see
      # docs/configuration.md#branding). Empty folder = neutral defaults.
      - ${BRANDING_LOCATION:-./branding}:/app/branding:ro
      # Settings changed on the admin page (settings.json). Must stay writable.
      - eg-portal-data:/app/data
    ports:
      # Public guest portal -> reverse proxy, no authentication
      - "${BIND_IP:-0.0.0.0}:${PORTAL_HOST_PORT:-3100}:3000"
      # Admin pages -> reverse proxy WITH authentication (never public!)
      - "${BIND_IP:-0.0.0.0}:${ADMIN_HOST_PORT:-3101}:3001"
    networks:
      - eg-portal
    depends_on:
      - immich-server
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    cpus: ${PORTAL_CPUS:-1}
    logging: *logging
    healthcheck:
      test: curl -fs http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      interval: 30s
      start_period: 20s
      timeout: 5s

networks:
  # Immich internals: server, machine learning, database, Valkey
  eg-internal:
  # Portal <-> Immich server only
  eg-portal:

volumes:
  # Machine learning models (no backup needed, downloaded again on demand)
  eg-model-cache:
  # Portal settings saved on the admin page (a few bytes)
  eg-portal-data:
